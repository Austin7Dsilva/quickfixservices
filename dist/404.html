<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Quick Fix Services Shivamogga</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-dark: #060a16;
            --bg-card: #0c1428;
            --primary-gold: #ffb800;
            --primary-gradient: linear-gradient(135deg, #ffb800 0%, #e69d00 100%);
            --primary-gradient-hover: linear-gradient(135deg, #ffc72c 0%, #fca311 100%);
            --text-light: #ffffff;
            --text-body: #94a3b8;
            --border-color: rgba(255, 184, 0, 0.08);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 184, 0, 0.05);
        }

        .logo {
            width: 160px;
            height: auto;
            margin-bottom: 24px;
        }

        h1 {
            font-family: var(--font-heading);
            color: var(--text-light);
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 40%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-family: var(--font-heading);
            color: var(--text-light);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
            color: var(--text-body);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 15px;
            padding: 12px 32px;
            border-radius: 9999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            background: var(--primary-gradient);
            color: #000000;
            box-shadow: 0 4px 14px rgba(255, 184, 0, 0.25);
            border: none;
        }

        .btn:hover {
            background: var(--primary-gradient-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 184, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/logo.png" alt="Quick Fix Services Logo" class="logo">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back home to schedule your repairs.</p>
        <a href="/" class="btn">Go Back Home</a>
    </div>
</body>
</html>
